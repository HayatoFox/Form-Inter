services:
  scraper:
    build: .
    container_name: scrap-formations
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      # Planification cron (défaut : tous les jours à 6 h)
      CRON_SCHEDULE: "0 6 * * *"
      # Mettre à 0 pour ne pas scraper au démarrage du conteneur
      SCRAPE_AT_STARTUP: "1"
    volumes:
      - ./data:/app/data   # la BDD SQLite reste accessible sur l'hôte
      - ./logs:/app/logs

  webapp:
    build: .
    container_name: scrap-webapp
    restart: unless-stopped
    command: ["webapp"]
    environment:
      TZ: Europe/Paris
      # Premier compte admin, créé uniquement si aucun utilisateur n'existe
      WEBAPP_ADMIN_USER: "admin"
      WEBAPP_ADMIN_PASSWORD: "a-changer-des-la-premiere-connexion"
      # Jeton de l'API JSON lue par le site Next.js (/api/sante, /api/sessions).
      # Laissé vide, l'API reste fermée (503) : à renseigner uniquement si le
      # site se branche en mode HTTP. Doit correspondre au jeton saisi dans
      # Admin › Sources de données côté site.
      WEBAPP_API_TOKEN: ""
    ports:
      - "8000:8000"        # à garder sur le LAN/VPN (pas de HTTPS intégré)
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
