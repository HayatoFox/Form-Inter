# Hôte virtuel Apache pour exposer le site de consultation sur
# forminter.proinsec.com, devant le conteneur Next.js (port 3000).
#
# Installation (Debian/Ubuntu) :
#
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo cp apache/forminter.conf /etc/apache2/sites-available/forminter.conf
#   sudo a2ensite forminter
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Certificat : le plus simple est certbot, qui remplit le bloc :443 lui-même —
#
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d forminter.proinsec.com
#
# (nécessite que forminter.proinsec.com résolve vers ce serveur et que le
# port 80 soit joignable depuis Internet pour la validation ; sinon, poser un
# certificat interne à la main dans le bloc :443 ci-dessous).
#
# Une fois le proxy en place, régler dans le .env du projet :
#   SITE_BIND=127.0.0.1
# puis relancer ./deploy.sh — le port 3000 n'est alors joignable que par
# Apache, plus directement depuis le réseau.

<VirtualHost *:80>
    ServerName forminter.proinsec.com

    # Tout le trafic passe en HTTPS. Certbot ajoute une règle équivalente
    # tout seul ; celle-ci couvre le cas d'un certificat posé à la main.
    RedirectPermanent / https://forminter.proinsec.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName forminter.proinsec.com

    # Certificat : rempli par certbot, ou à renseigner à la main.
    SSLEngine on
    # SSLCertificateFile      /etc/letsencrypt/live/forminter.proinsec.com/fullchain.pem
    # SSLCertificateKeyFile   /etc/letsencrypt/live/forminter.proinsec.com/privkey.pem

    # Indispensable : Next.js vérifie que l'origine des actions serveur (les
    # formulaires du back office) correspond à l'hôte de la requête. Sans
    # ProxyPreserveHost, il voit « localhost:3000 » et rejette les POST.
    ProxyPreserveHost On

    # Indispensable : c'est cet en-tête qui fait passer le cookie
    # d'administration en Secure. Sans lui, la session fonctionne mais reste
    # posée sans le drapeau Secure.
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Le site n'a pas d'upload plus lourd que les fichiers Excel d'import :
    # la limite par défaut d'Apache suffit.

    ErrorLog  ${APACHE_LOG_DIR}/forminter_error.log
    CustomLog ${APACHE_LOG_DIR}/forminter_access.log combined
</VirtualHost>

# Le site interne de veille (port 8000) n'est volontairement PAS exposé ici :
# il reste sur le LAN/VPN. Pour le publier aussi, dupliquer ce fichier avec un
# autre ServerName et ProxyPass vers http://127.0.0.1:8000/.
